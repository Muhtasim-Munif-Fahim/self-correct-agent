[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-correct"
version = "0.2.0"
description = "A lightweight anti-hallucination wrapper for LLMs using Chain-of-Verification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Muhtasim Munif Fahim" }
]
keywords = ["llm", "hallucination", "verification", "openai", "agent"]
dependencies = [
  "openai>=1.30.0"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
search = ["duckduckgo-search>=6.0.0"]
dev = [
  "pytest>=8.0.0",
  "nbformat>=5.10.0",
  "wikipedia>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/Muhtasim-Munif-Fahim/self-correct-agent"
Repository = "https://github.com/Muhtasim-Munif-Fahim/self-correct-agent"
Issues = "https://github.com/Muhtasim-Munif-Fahim/self-correct-agent/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[project.scripts]
self-correct = "self_correct.cli:main"
